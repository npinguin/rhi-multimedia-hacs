start_activity:
  name: Start multimedia activity
  description: Runs a configured real AV activity and checks source feedback.
  fields:
    room:
      required: true
      example: salon
      selector:
        text: {}
    activity:
      required: true
      example: watch_apple_tv
      selector:
        text: {}
stop_activity:
  name: Stop multimedia activity
  description: Stops the activity and releases only devices not claimed by other rooms.
  fields:
    room:
      required: true
      selector:
        text: {}
recover_activity:
  name: Recover multimedia activity
  description: Reruns the previous route and checks device readback after interruption.
  fields:
    room:
      required: true
      selector:
        text: {}
inspect_room:
  name: Inspect multimedia sources
  description: Publishes native source_list and current input state for each configured endpoint.
  fields:
    room:
      required: true
      selector:
        text: {}

control_device:
  name: Control device
  description: Execute a supported native device action within a configured room.
  fields:
    room:
      required: true
      selector:
        text:
    device:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        text:
    value:
      description: Optional source, sound mode, offered native remote key (including bounded hold/repeat), volume (0–1), seek seconds, mute boolean, or offered native group peer.
      selector:
        object:
    expected_activity:
      description: Optional current activity identity for focus-sensitive commands.
      selector:
        text:

press_activity_button:
  name: Press assigned activity button
  description: Uses the configured native device for one activity button; never starts another activity.
  fields:
    room:
      required: true
      selector:
        text: {}
    button:
      required: true
      selector:
        text: {}

run_activity_macro:
  name: Run activity shortcut
  description: Runs a validated one-touch sequence through the active Multimedia engine.
  fields:
    room:
      required: true
      selector:
        text: {}
    macro:
      required: true
      selector:
        text: {}
